name: islami_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.0.0
  cupertino_icons: ^1.0.8
  flutter_native_splash: ^2.4.7
  animate_do: ^4.2.0
  carousel_slider: ^5.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/suras/
    - assets/audio/

  fonts:
    - family: janna
      fonts:
        - asset: assets/fonts/Janna_LT_Bold.ttf
          weight: 800
        - asset: assets/fonts/Janna_LT_Regular.ttf
          weight: 500